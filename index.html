<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Log</title>
    <link rel="stylesheet" href="styles.css?v=transfer-note-3" />
  </head>
  <body>
    <main class="app">
      <section id="log" class="log" hidden></section>

      <div id="reading-panel" class="reading-panel" hidden>
        <div class="reading-progress">
          <div class="reading-progress-track" aria-hidden="true">
            <div id="reading-progress-fill" class="reading-progress-fill"></div>
          </div>
          <span id="reading-progress-label" class="reading-progress-label"></span>
        </div>
        <div class="reading-actions">
          <button type="button" id="edit-total-btn" class="reading-action-btn">
            Edit total
          </button>
          <button type="button" id="new-book-btn" class="reading-action-btn">
            New book
          </button>
        </div>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="category">Category</label>
        <!-- Options are built from the saved categories in script.js. -->
        <select id="category" class="composer-category" name="category" required></select>

        <div id="composer-fields" class="composer-fields">
          <label class="sr-only" for="duration">Duration</label>
          <input
            id="duration"
            class="composer-input"
            name="duration"
            type="text"
            placeholder="1 13 · 45m · 2s · 1h 30m"
            required
          />

          <div id="reading-fields" class="reading-fields" hidden>
            <label class="sr-only" for="page-from">Page from</label>
            <input
              id="page-from"
              class="composer-input page-input"
              name="pageFrom"
              type="text"
              inputmode="numeric"
              placeholder="from"
              autocomplete="off"
            />
            <span class="page-range-sep" aria-hidden="true">–</span>
            <label class="sr-only" for="page-to">Page to</label>
            <input
              id="page-to"
              class="composer-input page-input"
              name="pageTo"
              type="text"
              inputmode="numeric"
              placeholder="to"
              autocomplete="off"
            />
          </div>
        </div>

        <button class="composer-submit" type="submit" aria-label="Submit">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M3.4 20.4 20.85 12 3.4 3.6v6.55L13.75 12 3.4 13.85v6.55Z"
            />
          </svg>
        </button>
      </form>

      <dialog id="book-dialog" class="book-dialog">
        <form id="book-dialog-form" class="book-dialog-form">
          <h2 id="book-dialog-title" class="book-dialog-title">New book</h2>
          <p class="book-dialog-hint">How many pages does this book have?</p>
          <label class="sr-only" for="book-total-pages">Total pages</label>
          <input
            id="book-total-pages"
            class="composer-input book-total-input"
            type="text"
            inputmode="numeric"
            placeholder="e.g. 241"
            required
          />
          <div class="book-dialog-actions">
            <button type="button" class="reading-action-btn" id="book-dialog-cancel">
              Cancel
            </button>
            <button type="submit" class="reading-action-btn reading-action-btn-primary" id="book-dialog-confirm">
              Save
            </button>
          </div>
        </form>
      </dialog>

      <dialog id="transfer-note-dialog" class="book-dialog transfer-note-dialog">
        <form id="transfer-note-form" class="book-dialog-form">
          <h2 class="book-dialog-title">Transfer</h2>
          <p id="transfer-note-summary" class="book-dialog-hint"></p>
          <label class="sr-only" for="transfer-note-input">What did you work on?</label>
          <textarea
            id="transfer-note-input"
            class="composer-input transfer-note-input"
            rows="3"
            placeholder="What did you work on?"
            autocomplete="off"
          ></textarea>
          <div class="book-dialog-actions">
            <button type="button" class="reading-action-btn" id="transfer-note-cancel">
              Cancel
            </button>
            <button type="button" class="reading-action-btn" id="transfer-note-skip">
              Skip
            </button>
            <button type="submit" class="reading-action-btn reading-action-btn-primary" id="transfer-note-submit">
              Save note
            </button>
          </div>
          <p id="transfer-note-warning" class="transfer-note-warning" hidden>
            Cancel aborts the transfer — time will not be logged. Press Cancel or Esc again to confirm.
          </p>
        </form>
      </dialog>
    </main>

    <aside
      id="side-rail"
      class="side-rail"
      aria-label="Tools"
    >
      <div class="side-panels">
        <div
          id="panel-timers"
          class="side-panel"
          role="tabpanel"
          aria-labelledby="tab-timers"
          data-panel="timers"
        >
          <div id="stopwatch-list" class="stopwatch-list"></div>

          <div class="stopwatch-manage">
            <button type="button" class="stopwatch-btn" id="stopwatch-add" data-action="add-stopwatch">
              Add
            </button>
            <button type="button" class="stopwatch-btn" id="stopwatch-remove" data-action="remove-stopwatch">
              Remove
            </button>
          </div>

          <div
            id="bridge-stopwatch"
            class="stopwatch stopwatch-bridge"
            data-bridge-stopwatch
            aria-label="Adjustment stopwatch"
          >
            <label class="stopwatch-bridge-heading" for="bridge-stopwatch-visible">
              <input
                type="checkbox"
                id="bridge-stopwatch-visible"
                class="stopwatch-bridge-check"
                checked
                aria-controls="bridge-stopwatch-body"
                aria-label="Show adjustment stopwatch"
              />
              <span class="stopwatch-bridge-check-bubble" aria-hidden="true"></span>
              <span class="stopwatch-bridge-label">Adjust</span>
            </label>
            <div id="bridge-stopwatch-body" class="stopwatch-bridge-body">
              <div class="stopwatch-display" aria-live="polite">
                <span class="stopwatch-hours">00</span>
                <span class="stopwatch-sep" aria-hidden="true">:</span>
                <span class="stopwatch-minutes">00</span>
                <span class="stopwatch-sep" aria-hidden="true">:</span>
                <span class="stopwatch-seconds">00</span>
              </div>
              <div class="stopwatch-actions">
                <button type="button" class="stopwatch-btn" data-action="bridge-toggle">
                  Start
                </button>
                <button type="button" class="stopwatch-btn" data-action="bridge-reset">
                  Reset
                </button>
              </div>
              <div class="stopwatch-actions">
                <button type="button" class="stopwatch-btn" data-action="bridge-add">
                  Add to…
                </button>
                <button type="button" class="stopwatch-btn" data-action="bridge-subtract">
                  Subtract from…
                </button>
              </div>
              <div
                id="bridge-stopwatch-picker"
                class="stopwatch-adjust-picker"
                role="group"
                aria-label="Choose stopwatch to adjust"
                hidden
              ></div>
            </div>
          </div>

          <div class="stopwatch-adjust" aria-label="Adjust stopwatch time">
            <div class="stopwatch-adjust-inputs">
              <label class="sr-only" for="stopwatch-adjust-minutes">Minutes</label>
              <input
                id="stopwatch-adjust-minutes"
                class="composer-input stopwatch-adjust-input"
                type="text"
                inputmode="numeric"
                placeholder="min"
                autocomplete="off"
              />
              <label class="sr-only" for="stopwatch-adjust-seconds">Seconds</label>
              <input
                id="stopwatch-adjust-seconds"
                class="composer-input stopwatch-adjust-input"
                type="text"
                inputmode="numeric"
                placeholder="sec"
                autocomplete="off"
              />
            </div>
            <div class="stopwatch-adjust-actions">
              <button type="button" class="stopwatch-btn" data-action="adjust-add">Add</button>
              <button type="button" class="stopwatch-btn" data-action="adjust-subtract">Subtract</button>
            </div>
            <div
              id="stopwatch-adjust-picker"
              class="stopwatch-adjust-picker"
              role="group"
              aria-label="Choose stopwatch"
              hidden
            ></div>
          </div>
        </div>

        <div
          id="panel-next-book"
          class="side-panel side-panel-next-book"
          role="tabpanel"
          aria-labelledby="tab-next-book"
          data-panel="next-book"
          hidden
        >
          <div class="next-book-form">
            <label class="sr-only" for="next-book-url">Next book URL</label>
            <input
              id="next-book-url"
              class="composer-input next-book-url-input"
              type="url"
              name="nextBookUrl"
              placeholder="https://…"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" id="next-book-paste" class="next-book-paste-btn">
              Paste
            </button>
            <label class="sr-only" for="open-threshold-input">Open threshold percent</label>
            <input
              id="open-threshold-input"
              class="composer-input next-book-url-input open-threshold-input"
              type="text"
              inputmode="numeric"
              name="openThreshold"
              placeholder="80"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="button" id="open-threshold-update" class="next-book-paste-btn">
              Update
            </button>
            <ul id="threshold-history" class="threshold-history" aria-label="Threshold update history"></ul>
          </div>
        </div>

        <div
          id="panel-categories"
          class="side-panel side-panel-categories"
          role="tabpanel"
          aria-labelledby="tab-categories"
          data-panel="categories"
          hidden
        >
          <p class="category-editor-hint">
            Pick a category below to delete. Reading can’t be deleted. Past logs keep their names.
          </p>
          <div id="category-editor" class="category-editor"></div>
          <form id="category-add-form" class="category-add-form" autocomplete="off">
            <label class="sr-only" for="category-add-input">New category name</label>
            <input
              id="category-add-input"
              class="composer-input category-name-input"
              type="text"
              maxlength="40"
              placeholder="New category"
              spellcheck="false"
            />
            <button type="submit" class="stopwatch-btn category-add-btn">Add</button>
            <label class="sr-only" for="category-delete-select">Category to delete</label>
            <select
              id="category-delete-select"
              class="composer-input category-delete-select"
            >
              <option value="">Select category</option>
            </select>
            <button
              type="button"
              id="category-delete-btn"
              class="stopwatch-btn category-delete-action"
              disabled
            >
              Delete
            </button>
            <p id="category-add-error" class="category-error" hidden></p>
          </form>
        </div>
      </div>

      <div class="side-tabs" role="tablist" aria-orientation="vertical" aria-label="Tool tabs">
        <button
          type="button"
          class="side-tab"
          role="tab"
          id="tab-timers"
          aria-controls="panel-timers"
          aria-selected="true"
          data-tab="timers"
        >
          <span class="side-tab-label">Stopwatch</span>
        </button>
        <button
          type="button"
          class="side-tab"
          role="tab"
          id="tab-next-book"
          aria-controls="panel-next-book"
          aria-selected="false"
          data-tab="next-book"
          tabindex="-1"
        >
          <span class="side-tab-label">Next book</span>
        </button>
        <button
          type="button"
          class="side-tab"
          role="tab"
          id="tab-categories"
          aria-controls="panel-categories"
          aria-selected="false"
          data-tab="categories"
          tabindex="-1"
        >
          <span class="side-tab-label">Categories</span>
        </button>
      </div>
    </aside>

    <script src="vendor/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js?v=transfer-note-3"></script>
  </body>
</html>

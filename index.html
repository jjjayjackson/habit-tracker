<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Log</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="log" class="log" hidden></section>

      <div id="reading-panel" class="reading-panel" hidden>
        <div class="reading-progress">
          <div class="reading-progress-track" aria-hidden="true">
            <div id="reading-progress-fill" class="reading-progress-fill"></div>
          </div>
          <span id="reading-progress-label" class="reading-progress-label"></span>
        </div>
        <div class="reading-actions">
          <button type="button" id="edit-total-btn" class="reading-action-btn">
            Edit total
          </button>
          <button type="button" id="new-book-btn" class="reading-action-btn">
            New book
          </button>
        </div>
      </div>

      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="category">Category</label>
        <select id="category" class="composer-category" name="category" required>
          <option value="Drafts to Drive">Drafts to Drive</option>
          <option value="Programming • Figma • CAD">Programming • Figma • CAD</option>
          <option value="School">School</option>
          <option value="Reading">Reading</option>
          <option value="TDs">TDs</option>
        </select>

        <div id="composer-fields" class="composer-fields">
          <label class="sr-only" for="duration">Duration</label>
          <input
            id="duration"
            class="composer-input"
            name="duration"
            type="text"
            placeholder="1 13 · 45m · 2s · 1h 30m"
            required
          />

          <div id="reading-fields" class="reading-fields" hidden>
            <label class="sr-only" for="page-from">Page from</label>
            <input
              id="page-from"
              class="composer-input page-input"
              name="pageFrom"
              type="text"
              inputmode="numeric"
              placeholder="from"
              autocomplete="off"
            />
            <span class="page-range-sep" aria-hidden="true">–</span>
            <label class="sr-only" for="page-to">Page to</label>
            <input
              id="page-to"
              class="composer-input page-input"
              name="pageTo"
              type="text"
              inputmode="numeric"
              placeholder="to"
              autocomplete="off"
            />
          </div>
        </div>

        <button class="composer-submit" type="submit" aria-label="Submit">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M3.4 20.4 20.85 12 3.4 3.6v6.55L13.75 12 3.4 13.85v6.55Z"
            />
          </svg>
        </button>
      </form>

      <dialog id="book-dialog" class="book-dialog">
        <form id="book-dialog-form" class="book-dialog-form">
          <h2 id="book-dialog-title" class="book-dialog-title">New book</h2>
          <p class="book-dialog-hint">How many pages does this book have?</p>
          <label class="sr-only" for="book-total-pages">Total pages</label>
          <input
            id="book-total-pages"
            class="composer-input book-total-input"
            type="text"
            inputmode="numeric"
            placeholder="e.g. 241"
            required
          />
          <div class="book-dialog-actions">
            <button type="button" class="reading-action-btn" id="book-dialog-cancel">
              Cancel
            </button>
            <button type="submit" class="reading-action-btn reading-action-btn-primary" id="book-dialog-confirm">
              Save
            </button>
          </div>
        </form>
      </dialog>
    </main>

    <div id="stopwatch-edge" class="stopwatch-edge" aria-hidden="true"></div>
    <button
      type="button"
      id="stopwatch-tab"
      class="stopwatch-tab"
      aria-expanded="false"
      aria-controls="stopwatch-sidebar"
      aria-label="Open stopwatches"
    >
      <span class="stopwatch-tab-label">Timers</span>
    </button>

    <aside
      id="stopwatch-sidebar"
      class="stopwatch-sidebar"
      aria-hidden="true"
      aria-label="Stopwatches"
    >
      <div class="stopwatch" data-stopwatch="0">
        <div class="stopwatch-display" aria-live="polite">
          <span class="stopwatch-hours">00</span>
          <span class="stopwatch-sep" aria-hidden="true">:</span>
          <span class="stopwatch-minutes">00</span>
          <span class="stopwatch-sep" aria-hidden="true">:</span>
          <span class="stopwatch-seconds">00</span>
        </div>
        <div class="stopwatch-actions">
          <button type="button" class="stopwatch-btn" data-action="toggle">Start</button>
          <button type="button" class="stopwatch-btn" data-action="reset">Reset</button>
        </div>
        <div class="stopwatch-transfer">
          <button
            type="button"
            class="stopwatch-btn stopwatch-transfer-btn"
            data-action="transfer"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            Transfer
          </button>
          <div class="stopwatch-transfer-menu" role="menu" hidden></div>
          <div class="stopwatch-reading-fields" hidden>
            <label class="sr-only" for="sw-0-page-from">Page from</label>
            <input
              id="sw-0-page-from"
              class="composer-input page-input stopwatch-page-input"
              type="text"
              inputmode="numeric"
              placeholder="from"
              autocomplete="off"
              data-page-from
            />
            <span class="page-range-sep" aria-hidden="true">–</span>
            <label class="sr-only" for="sw-0-page-to">Page to</label>
            <input
              id="sw-0-page-to"
              class="composer-input page-input stopwatch-page-input"
              type="text"
              inputmode="numeric"
              placeholder="to"
              autocomplete="off"
              data-page-to
            />
          </div>
        </div>
      </div>

      <div class="stopwatch" data-stopwatch="1">
        <div class="stopwatch-display" aria-live="polite">
          <span class="stopwatch-hours">00</span>
          <span class="stopwatch-sep" aria-hidden="true">:</span>
          <span class="stopwatch-minutes">00</span>
          <span class="stopwatch-sep" aria-hidden="true">:</span>
          <span class="stopwatch-seconds">00</span>
        </div>
        <div class="stopwatch-actions">
          <button type="button" class="stopwatch-btn" data-action="toggle">Start</button>
          <button type="button" class="stopwatch-btn" data-action="reset">Reset</button>
        </div>
        <div class="stopwatch-transfer">
          <button
            type="button"
            class="stopwatch-btn stopwatch-transfer-btn"
            data-action="transfer"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            Transfer
          </button>
          <div class="stopwatch-transfer-menu" role="menu" hidden></div>
          <div class="stopwatch-reading-fields" hidden>
            <label class="sr-only" for="sw-1-page-from">Page from</label>
            <input
              id="sw-1-page-from"
              class="composer-input page-input stopwatch-page-input"
              type="text"
              inputmode="numeric"
              placeholder="from"
              autocomplete="off"
              data-page-from
            />
            <span class="page-range-sep" aria-hidden="true">–</span>
            <label class="sr-only" for="sw-1-page-to">Page to</label>
            <input
              id="sw-1-page-to"
              class="composer-input page-input stopwatch-page-input"
              type="text"
              inputmode="numeric"
              placeholder="to"
              autocomplete="off"
              data-page-to
            />
          </div>
        </div>
      </div>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
